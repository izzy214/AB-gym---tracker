<!doctype html>
<html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>AB GYM Tracker 2.0</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:dark;--bg:#0b0d10;--card:#171a20;--line:#303642;--text:#f7f7f7;--muted:#b9c0cc;--accent:#66d9a6;--warn:#ffd166;--bad:#ff8a8a;--blue:#8fc7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:18px;line-height:1.35}.wrap{max-width:540px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}h1{font-size:30px;margin:8px 0 4px;letter-spacing:.3px}h2{font-size:25px;margin:8px 0}.sub{color:var(--muted);font-size:16px;margin-bottom:20px}.menu{display:grid;gap:12px}.btn{width:100%;border:0;border-radius:16px;padding:18px 16px;background:var(--card);color:var(--text);font-weight:800;font-size:20px;text-align:left;border:1px solid var(--line)}.btn.primary{background:var(--accent);color:#07110d}.btn.small{padding:12px 14px;font-size:17px}.top{display:flex;gap:10px;margin-bottom:14px}.top .btn{flex:1}.exercise{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.num{display:inline-flex;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;background:var(--accent);color:#07110d;font-weight:900;margin-right:8px}.name{font-size:21px;font-weight:850}.target{color:var(--muted);font-size:15px;margin:8px 0 10px}.last{padding:10px 11px;border-radius:12px;background:#101319;border:1px solid #252b35;font-size:15px;color:var(--muted);margin:10px 0}.last strong{color:var(--text)}.recommend{padding:11px;border-radius:12px;border:1px solid var(--line);margin:10px 0;font-size:15px}.recommend b{display:block;font-size:16px;margin-bottom:2px}.rec-up{border-color:var(--accent)}.rec-hold{border-color:var(--blue)}.rec-warn{border-color:var(--warn)}.setrow{display:grid;grid-template-columns:48px 1.15fr .9fr .8fr;gap:7px;align-items:end;margin:8px 0}.setno{font-size:14px;font-weight:800;color:var(--muted);padding-bottom:14px}.lab{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#0f1217;color:white;font-size:19px;padding:8px;text-align:center}input:focus{outline:2px solid var(--accent)}.stepbox{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:14px}.stepbox input{width:78px;min-height:40px;font-size:16px}.actions{display:grid;gap:10px;margin-top:18px}.history-item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:9px 0}.history-date{font-weight:850}.history-row{font-size:15px;color:var(--muted);margin-top:7px}.history-row strong{color:var(--text)}.hidden{display:none}.note{font-size:14px;color:var(--warn);margin:12px 2px}.danger{background:#2a1719}.footer{color:var(--muted);font-size:13px;text-align:center;margin-top:22px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;margin:3px 3px 0 0;font-size:13px;color:var(--muted)}
</style></head><body><div class="wrap">
<section id="home"><h1>ATHLETIC BLUEPRINT</h1><div class="sub">GYM TRACKER 2.0 · SMART PROGRESSION</div><div class="menu"><button class="btn primary" onclick="openWorkout('A')">TRENING A</button><button class="btn primary" onclick="openWorkout('B')">TRENING B</button><button class="btn primary" onclick="openWorkout('C')">BOOSTER C</button><button class="btn" onclick="showHistory()">ZGODOVINA</button></div><p class="note">Vpiši vsako delovno serijo. Tracker uporabi double progression: najprej reps, nato najmanjši praktičen dvig teže.</p></section>
<section id="workout" class="hidden"><div class="top"><button class="btn small" onclick="goHome()">← MENI</button><button class="btn small" onclick="showHistory(current)">ZGODOVINA</button></div><h2 id="wtitle"></h2><div id="elist"></div><div class="actions"><button class="btn primary" onclick="saveWorkout()">SHRANI TRENING</button><button class="btn danger" onclick="clearForm()">POČISTI VNOS</button></div></section>
<section id="history" class="hidden"><div class="top"><button class="btn small" onclick="goHome()">← MENI</button></div><h2>ZGODOVINA</h2><div id="hist"></div></section>
<div class="footer">AB GYM 2.0 · podatki ostanejo shranjeni lokalno v tem okolju</div></div>
<script>
const plans={
A:[
{name:'Incline Dumbbell Press',sets:3,min:8,max:12,rirMin:2,rirMax:2,rest:'2 min',step:2},
{name:'Chest-Supported Row Machine',sets:3,min:8,max:12,rirMin:2,rirMax:2,rest:'2 min',step:5},
{name:'Single-Arm Cable Lateral Raise',sets:3,min:12,max:20,rirMin:1,rirMax:2,rest:'60–75 s',step:2.5,note:'/ stran'},
{name:'Horizontal Leg Press',sets:2,min:8,max:12,rirMin:3,rirMax:3,rest:'2 min',step:5},
{name:'Kneeling Cable Crunch',sets:3,min:10,max:15,rirMin:1,rirMax:2,rest:'75 s',step:5},
{name:'Incline Dumbbell Curl',sets:2,min:8,max:12,rirMin:1,rirMax:2,rest:'75 s',step:2},
{name:'Cable Triceps Pushdown',sets:2,min:10,max:15,rirMin:1,rirMax:2,rest:'75 s',step:5}],
B:[
{name:'Lat Pulldown',sets:3,min:8,max:12,rirMin:2,rirMax:2,rest:'2 min',step:5},
{name:'Seated Dumbbell Shoulder Press',sets:3,min:8,max:12,rirMin:2,rirMax:2,rest:'2 min',step:2},
{name:'Romanian Deadlift',sets:2,min:8,max:10,rirMin:2,rirMax:3,rest:'2–3 min',step:5},
{name:'Pec Deck',sets:2,min:10,max:15,rirMin:1,rirMax:2,rest:'75–90 s',step:5},
{name:'Cable Reverse Fly',sets:2,min:12,max:20,rirMin:1,rirMax:2,rest:'60–75 s',step:2.5},
{name:'EZ-Bar Preacher Curl',sets:2,min:10,max:15,rirMin:1,rirMax:2,rest:'75 s',step:2.5},
{name:'Overhead Cable Triceps Extension',sets:2,min:10,max:15,rirMin:1,rirMax:2,rest:'75 s',step:5},
{name:'Reverse Crunch',sets:2,min:10,max:15,rirMin:1,rirMax:2,rest:'60–75 s',step:0}],
C:[
{name:'Lat Pulldown',sets:2,min:10,max:15,rirMin:2,rirMax:2,rest:'90 s',step:5},
{name:'Single-Arm Cable Lateral Raise',sets:3,min:12,max:20,rirMin:1,rirMax:2,rest:'60 s',step:2.5,note:'/ stran'},
{name:'Cable Reverse Fly',sets:2,min:15,max:20,rirMin:1,rirMax:2,rest:'60 s',step:2.5},
{name:'Incline Dumbbell Curl',sets:2,min:10,max:15,rirMin:1,rirMax:1,rest:'60–75 s',step:2},
{name:'Overhead Cable Triceps Extension',sets:2,min:10,max:15,rirMin:1,rirMax:1,rest:'60–75 s',step:5},
{name:'Cable Crunch',sets:2,min:12,max:15,rirMin:1,rirMax:2,rest:'60 s',step:5}]
};
let current='A';
const home=document.getElementById('home'),workout=document.getElementById('workout'),history=document.getElementById('history'),wtitle=document.getElementById('wtitle'),elist=document.getElementById('elist'),hist=document.getElementById('hist');
function data(){try{return JSON.parse(localStorage.getItem('abgymtracker')||'[]')}catch(e){return[]}}
function setData(x){localStorage.setItem('abgymtracker',JSON.stringify(x))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function num(v){let n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:null}
function latestSession(w,name){return data().filter(x=>x.workout===w).slice().reverse().map(x=>({session:x,entry:(x.entries||[]).find(e=>e.name===name)})).find(x=>x.entry)?.entry||null}
function lastTwo(w,name){return data().filter(x=>x.workout===w).slice().reverse().map(x=>(x.entries||[]).find(e=>e.name===name)).filter(Boolean).slice(0,2)}
function normalizedSets(entry){if(!entry)return[];if(Array.isArray(entry.sets))return entry.sets;return [{kg:entry.kg,reps:entry.reps,rir:entry.rir}]}
function formatSets(entry){let ss=normalizedSets(entry).filter(s=>s.kg||s.reps||s.rir);if(!ss.length)return 'še ni vnosa';return ss.map((s,i)=>`S${i+1}: <strong>${esc(s.kg||'—')} kg · ${esc(s.reps||'—')} reps · RIR ${esc(s.rir||'—')}</strong>`).join('<br>')}
function storedStep(w,name,def){let v=localStorage.getItem('abstep:'+w+':'+name);return v===null?def:v}
function recommendation(w,e){let last=latestSession(w,e.name);if(!last)return {cls:'rec-hold',title:'PRVI TRENING',text:'Izberi delovno težo, ki ustreza razponu in ciljnemu RIR. Nato jo shrani.'};let ss=normalizedSets(last).filter(s=>num(s.reps)!==null&&num(s.rir)!==null);if(ss.length<e.sets)return {cls:'rec-hold',title:'DOPOLNI PODATKE',text:'Za avtomatsko priporočilo vpiši reps in RIR za vse delovne serije.'};let top=ss.every(s=>num(s.reps)>=e.max && num(s.rir)>=e.rirMin);let below=ss.some(s=>num(s.reps)<e.min);let tooHard=ss.some(s=>num(s.rir)<e.rirMin);let kg=num(ss[0].kg);let step=num(storedStep(w,e.name,e.step));if(top&&kg!==null&&step&&step>0)return {cls:'rec-up',title:'POVEČAJ TEŽO',text:`Naslednjič poskusi ${fmt(kg+step)} kg. Vse serije so dosegle vrh razpona pri zahtevanem RIR.`};if(top&&(!step||step===0))return {cls:'rec-up',title:'NAPREDUJ',text:'Dosegel si vrh razpona. Izberi najmanjši praktičen naslednji korak.'};if(below||tooHard){let prev=lastTwo(w,e.name);let repeated=prev.length>=2&&prev.every(en=>normalizedSets(en).some(s=>num(s.reps)!==null&&num(s.reps)<e.min));return repeated?{cls:'rec-warn',title:'PREVERI TEŽO',text:'Dva zaporedna vnosa sta pod spodnjim robom razpona. Smiselno je zmanjšati breme za najmanjši praktičen korak.'}:{cls:'rec-warn',title:'OSTANI NA ISTI TEŽI',text:'Danes še ne povečuj. En slabši trening ni razlog za reset; ciljaj na predpisan reps in RIR.'};}
return {cls:'rec-hold',title:'DODAJ REPS',text:'Ostani na isti teži in postopno dodajaj ponovitve. Težo zvišaj šele, ko vse serije dosežejo vrh razpona pri zahtevanem RIR.'}}
function fmt(n){return Number.isInteger(n)?String(n):String(Math.round(n*100)/100).replace('.',',')}
function openWorkout(w){current=w;home.classList.add('hidden');history.classList.add('hidden');workout.classList.remove('hidden');wtitle.textContent=w==='C'?'BOOSTER C':'TRENING '+w;elist.innerHTML='';plans[w].forEach((e,i)=>{let last=latestSession(w,e.name),rec=recommendation(w,e),step=storedStep(w,e.name,e.step);let rows='';for(let s=0;s<e.sets;s++){let ls=normalizedSets(last)[s]||{};rows+=`<div class="setrow"><div class="setno">S${s+1}</div><div><div class="lab">TEŽA (kg)</div><input inputmode="decimal" id="kg${i}_${s}" placeholder="kg" value="${esc(ls.kg||'')}"></div><div><div class="lab">REPS</div><input inputmode="numeric" id="reps${i}_${s}" placeholder="reps"></div><div><div class="lab">RIR</div><input inputmode="decimal" id="rir${i}_${s}" placeholder="RIR"></div></div>`}elist.insertAdjacentHTML('beforeend',`<div class="exercise"><div><span class="num">${i+1}</span><span class="name">${e.name}</span></div><div class="target">${e.sets} × ${e.min}–${e.max}${e.note?' '+e.note:''} · cilj RIR ${e.rirMin===e.rirMax?e.rirMin:e.rirMin+'–'+e.rirMax} · počitek ${e.rest}</div><div class="last">ZADNJIČ:<br>${formatSets(last)}</div><div class="recommend ${rec.cls}"><b>${rec.title}</b>${rec.text}</div>${rows}<div class="stepbox">KORAK TEŽE <input inputmode="decimal" id="step${i}" value="${esc(step)}" onchange="saveStep(${i})"> kg</div></div>`)});scrollTo(0,0)}
function saveStep(i){let e=plans[current][i];localStorage.setItem('abstep:'+current+':'+e.name,document.getElementById('step'+i).value.trim())}
function saveWorkout(){let entries=plans[current].map((e,i)=>{saveStep(i);let sets=[];for(let s=0;s<e.sets;s++)sets.push({kg:document.getElementById(`kg${i}_${s}`).value.trim(),reps:document.getElementById(`reps${i}_${s}`).value.trim(),rir:document.getElementById(`rir${i}_${s}`).value.trim()});return {name:e.name,sets}});if(!entries.some(e=>e.sets.some(s=>s.kg||s.reps||s.rir))){alert('Najprej vpiši vsaj en rezultat.');return}let d=data();d.push({version:2,workout:current,date:new Date().toISOString(),entries});setData(d);alert('Trening '+current+' je shranjen.');openWorkout(current)}
function clearForm(){plans[current].forEach((e,i)=>{for(let s=0;s<e.sets;s++){document.getElementById(`kg${i}_${s}`).value='';document.getElementById(`reps${i}_${s}`).value='';document.getElementById(`rir${i}_${s}`).value=''}})}
function showHistory(filter){home.classList.add('hidden');workout.classList.add('hidden');history.classList.remove('hidden');let d=data().slice().reverse();if(filter)d=d.filter(x=>x.workout===filter);hist.innerHTML=d.length?'':'<p class="sub">Še ni shranjenih treningov.</p>';d.forEach(x=>{let date=new Date(x.date).toLocaleString('sl-SI',{dateStyle:'medium',timeStyle:'short'});let rows=(x.entries||[]).filter(e=>normalizedSets(e).some(s=>s.kg||s.reps||s.rir)).map(e=>`<div class="history-row"><strong>${esc(e.name)}</strong><br>${normalizedSets(e).filter(s=>s.kg||s.reps||s.rir).map((s,i)=>`<span class="pill">S${i+1}: ${esc(s.kg||'—')} kg · ${esc(s.reps||'—')} · RIR ${esc(s.rir||'—')}</span>`).join('')}</div>`).join('');hist.insertAdjacentHTML('beforeend',`<div class="history-item"><div class="history-date">${x.workout==='C'?'BOOSTER C':'TRENING '+x.workout} · ${date}</div>${rows}</div>`)});scrollTo(0,0)}
function goHome(){workout.classList.add('hidden');history.classList.add('hidden');home.classList.remove('hidden');scrollTo(0,0)}
</script></body></html>
